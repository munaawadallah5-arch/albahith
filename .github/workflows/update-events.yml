name: تحديث إعلانات الباحث

on:
  schedule:
    - cron: "17 4 * * 1"   # كل يوم إثنين الساعة 4:17 بتوقيت غرينتش
  workflow_dispatch: {}      # زر «Run workflow» للتشغيل اليدوي

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-events
  cancel-in-progress: false

# لا يستعمل هذا الملف أي إضافة خارجية (actions)؛ يكتفي بـ git و python3 و gh الموجودة في خادم GitHub،
# فيعمل حتى لو كانت إعدادات المستودع تمنع الإضافات الخارجية غير المثبّتة.
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: تنزيل ملفات الموقع
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD
          git config user.name "albahith-bot"
          git config user.email "albahith-bot@users.noreply.github.com"
          python3 --version

      - name: جمع الإعلانات الجديدة
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 updater/update_events.py

      - name: اقتراح الإعلانات في طلب دمج للمراجعة
        if: steps.run.outputs.changed == 'true' && steps.run.outputs.review == 'true'
        env:
          ADDED: ${{ steps.run.outputs.added }}
          REPORT: ${{ steps.run.outputs.report }}
        run: |
          BRANCH=auto/new-events
          git checkout -q -B "$BRANCH"
          git add events.js
          git commit -q -m "إعلانات جديدة ($ADDED)"
          git push -q -f origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "إعلانات جديدة للمراجعة ($ADDED)" --body-file "$REPORT"
          else
            gh pr create --head "$BRANCH" --base "${GITHUB_REF_NAME}" --title "إعلانات جديدة للمراجعة ($ADDED)" --body-file "$REPORT"
          fi

      - name: نشر الإعلانات مباشرة
        if: steps.run.outputs.changed == 'true' && steps.run.outputs.review != 'true'
        env:
          ADDED: ${{ steps.run.outputs.added }}
        run: |
          git add events.js
          git commit -q -m "إعلانات جديدة ($ADDED)"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"

      - name: التقرير
        if: always() && steps.run.outputs.report != ''
        run: cat "${{ steps.run.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"
